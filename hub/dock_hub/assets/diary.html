<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>守岸人日记 · 守岸人</title>
  <link rel="stylesheet" href="/assets/litera.min.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" />
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; background: #0e1013; color: #e6e6e6;
      font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
      display: flex; align-items: center; justify-content: center; min-height: 100vh;
    }
    .wrap { width: min(720px, 92vw); padding: 32px 0; }
    h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
    .sub { color: #8a8f98; font-size: 13px; margin-bottom: 24px; }
    .entry { background: #16181d; border: 1px solid #23262d; border-radius: 14px; padding: 16px 18px; margin-bottom: 12px; }
    .entry .head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
    .entry .day { font-size: 15px; font-weight: 600; }
    .entry .weekday { color: #8a8f98; font-size: 12px; margin-left: 8px; font-weight: 400; }
    .entry .text { font-size: 15px; line-height: 1.8; white-space: pre-wrap; }
    .entry .meta { color: #585d66; font-size: 12px; margin-top: 8px; display: flex; justify-content: space-between; align-items: center; }
    .entry .del { color: #585d66; font-size: 12px; cursor: pointer; background: none; border: none; padding: 0; font-family: inherit; }
    .entry .del:hover { color: #b07f7f; }
    .empty { color: #8a8f98; padding: 24px 0; text-align: center; }
    .foot { color: #585d66; font-size: 12px; margin-top: 18px; }
    a { color: #8a8f98; }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>守岸人日记</h1>
    <p class="sub" id="sub">她每天傍晚写一段今天。数据只留在你自己的 Hub 上。</p>
    <div id="entries"><div class="empty">读着呢…</div></div>
    <p class="foot">写的时刻在 hub.yaml 的 diary.at（默认 21:30）；diary: false 关掉。某一天不想要了就删掉。<a href="/chats">看对话原文</a> · <a href="/week">看桌面周报</a></p>
  </main>
  <script>
    const WEEKDAY = ["", "周日", "周一", "周二", "周三", "周四", "周五", "周六"];
    const SOURCE = { llm: "她自己写的", log: "大脑不在，她只记了句事实" };
    async function load() {
      try {
        const resp = await fetch("/v1/companion/diary", { headers: { "Accept": "application/json" } });
        if (resp.status === 401) { location.href = "/chats?next=/diary"; return; }
        render(await resp.json());
      } catch (err) {
        document.getElementById("entries").innerHTML = '<div class="empty">拉不下来：Hub 不在？</div>';
      }
    }
    function render(data) {
      if (data.enabled === false) {
        document.getElementById("sub").textContent = "日记关着（hub.yaml 里 diary: false）。哪天想让她写了，把那行删掉就行。";
      }
      const box = document.getElementById("entries");
      const items = data.entries || [];
      if (!items.length) {
        box.innerHTML = '<div class="empty">还没有日记。到点（' + (data.at || "21:30") + "）她就会写今天的头一段。</div>";
        return;
      }
      box.innerHTML = items.map((item) => {
        const d = new Date(item.date + "T00:00:00");
        const weekday = WEEKDAY[d.getDay()] || "";
        const source = SOURCE[item.source] || "";
        return '<div class="entry" data-day="' + item.date + '">' +
          '<div class="head"><div><span class="day">' + item.date + '</span><span class="weekday">' + weekday + "</span></div></div>" +
          '<div class="text"></div>' +
          '<div class="meta"><span>' + source + "</span>" +
          '<button class="del" onclick="delDay(\'' + item.date + '\')">删掉这一天</button></div></div>';
      }).join("");
      // text 走 textContent，别把她写的话当 HTML 执行
      document.querySelectorAll(".entry").forEach((node) => {
        const item = items.find((it) => it.date === node.dataset.day);
        if (item) node.querySelector(".text").textContent = item.text;
      });
    }
    async function delDay(day) {
      if (!confirm("删掉 " + day + " 这一天的日记？删了就没了。")) return;
      const resp = await fetch("/v1/companion/diary/" + day, { method: "DELETE" });
      if (resp.status === 401) { location.href = "/chats?next=/diary"; return; }
      if (resp.ok) load();
    }
    load();
  </script>
</body>
</html>
