<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>守岸人 · 对话</title>
    <link rel="stylesheet" href="/assets/pico.min.css" />
  <link rel="stylesheet" href="/assets/shell.css" />

</head>
<body class="talk">
  <nav class="container-fluid">
    <ul>
      <li><strong>守岸人</strong></li>
    </ul>
    <ul>
      <li><a href="/read" role="button" class="secondary">朗读</a></li>
      <li><a href="/chats" role="button" aria-current="page">对话</a></li>
      <li><a href="/setup" role="button" class="secondary">配置</a></li>
    </ul>
  </nav>
  <header class="container">
    <p class="sub">只从今晚起记下原文。更早的对话只留了字数。</p>
    <div class="bar" id="searchBar">
      <button class="secondary" id="prevDay" type="button" title="前一天">‹</button>
      <select id="dayPick" aria-label="挑一天"></select>
      <button class="secondary" id="nextDay" type="button" title="后一天">›</button>
      <input type="search" id="q" placeholder="搜索她或你说过的话" autocomplete="off" />
    </div>
  </header>
  <main id="feed"></main>
  <article id="gate" class="gate hide">
    <h2>局域网登录</h2>
    <p>填手机设置里同一枚 Hub Token。登录后会进入配置向导。本机打开不用填。</p>
    <div class="bar">
      <input type="password" id="token" placeholder="Token" autocomplete="off" />
      <button class="primary" id="login" type="button">进入</button>
    </div>
    <p id="gateErr" class="err"></p>
  </article>
  <script>
    const feed = document.getElementById("feed");
    const gate = document.getElementById("gate");
    const q = document.getElementById("q");
    const tokenBox = document.getElementById("token");
    const dayPick = document.getElementById("dayPick");
    const prevDay = document.getElementById("prevDay");
    const nextDay = document.getElementById("nextDay");
    let timer = null;
    // F30 时间线："" = 今晚（实时滚动到底），否则是正在翻的 YYYY-MM-DD
    let viewDay = "";
    let allDays = [];

    function authHeaders() {
      const t = sessionStorage.getItem("helm_chats_token") || "";
      return t ? { Authorization: "Bearer " + t } : {};
    }

    function skillLabel(s) {
      const name = s.name || s.id;
      if (!name) return s.route || "";
      const verb = s.on === false ? "关" : (s.id && /wegame|douyin|steam|cursor/i.test(s.id) ? "启动" : "开");
      const ok = s.ok === false ? "失败" : "";
      return verb + name + (ok ? " · " + ok : "");
    }

    function dayLabel(ts) {
      const d = new Date(ts);
      if (Number.isNaN(d.getTime())) return ts || "";
      return d.toLocaleDateString("zh-CN", { weekday: "short", month: "numeric", day: "numeric" });
    }

    function timeLabel(ts) {
      const d = new Date(ts);
      if (Number.isNaN(d.getTime())) return "";
      return d.toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    }

    function bubble(side, who, text, rec) {
      const row = document.createElement("div");
      row.className = "row " + side;
      const b = document.createElement("article");
      b.className = "bubble";
      const w = document.createElement("div");
      w.className = "who";
      w.textContent = who;
      b.appendChild(w);
      const p = document.createElement("div");
      p.textContent = text || "（无原文）";
      b.appendChild(p);
      if (rec && rec.skills && rec.skills.length) {
        rec.skills.forEach((s) => {
          const pill = document.createElement("span");
          pill.className = "pill" + (s.ok === false ? " bad" : "");
          pill.textContent = skillLabel(s);
          b.appendChild(pill);
        });
      }
      if (rec && rec.error) {
        const e = document.createElement("div");
        e.className = "err";
        e.textContent = rec.error;
        b.appendChild(e);
      }
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = timeLabel(rec && rec.ts) + (rec && rec.ms ? " · " + rec.ms + "ms" : "");
      b.appendChild(meta);
      row.appendChild(b);
      return row;
    }

    function render(items) {
      feed.innerHTML = "";
      if (!items.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = viewDay
          ? "这天没说话。"
          : "还没有记下原文。对脸说一句之后会出现在这里。";
        feed.appendChild(empty);
        return;
      }
      let lastDay = "";
      items.forEach((rec) => {
        const day = dayLabel(rec.ts);
        if (day !== lastDay) {
          const h = document.createElement("div");
          h.className = "day";
          h.textContent = day;
          feed.appendChild(h);
          lastDay = day;
        }
        feed.appendChild(bubble("you", "你", rec.user, rec));
        feed.appendChild(bubble("her", "守岸人", rec.reply, rec));
      });
      // 今晚跟着新话走；翻旧账就从这天最早的一句看起
      feed.scrollTop = viewDay ? 0 : feed.scrollHeight;
    }

    function dayChoice(d) {
      // 正午当锚点，免得 UTC 解析把日子挪前挪后一天
      return dayLabel(d + "T12:00:00");
    }

    function rebuildDayPick() {
      dayPick.innerHTML = "";
      const live = document.createElement("option");
      live.value = "";
      live.textContent = "今晚";
      dayPick.appendChild(live);
      allDays.forEach((d) => {
        const opt = document.createElement("option");
        opt.value = d;
        opt.textContent = dayChoice(d);
        dayPick.appendChild(opt);
      });
      syncDayUi();
    }

    function syncDayUi() {
      dayPick.value = viewDay;
      if (dayPick.value !== viewDay) viewDay = ""; // 挑的那天可能已被裁掉
      dayPick.value = viewDay;
      prevDay.disabled = viewDay !== "" && viewDay === allDays[0];
      nextDay.disabled = viewDay === "";
    }

    function stepDay(delta) {
      if (!allDays.length) return;
      let idx = allDays.indexOf(viewDay);
      if (idx < 0) idx = delta < 0 ? allDays.length : -1;
      idx += delta;
      viewDay = idx >= 0 && idx < allDays.length ? allDays[idx] : "";
      syncDayUi();
      load(false);
    }

    function nextPath() {
      const next = new URLSearchParams(location.search).get("next") || "";
      if (!next.startsWith("/") || next.startsWith("//") || next.includes("://") || next.includes("\\")) {
        return "";
      }
      return next;
    }

    function goNextOrLoad() {
      const next = nextPath();
      if (next) {
        location.replace(next);
        return;
      }
      load(true);
    }

    async function load(withMeta) {
      const params = new URLSearchParams();
      params.set("limit", "400");
      if (q.value.trim()) {
        // 搜索翻的是全部历史，不挑日子
      } else if (viewDay) {
        params.set("day", viewDay);
      }
      if (withMeta) params.set("with_days", "1");
      params.set("q", q.value.trim());
      const resp = await fetch("/v1/companion/chats?" + params.toString(), {
        headers: { Accept: "application/json", ...authHeaders() },
        credentials: "include",
      });
      if (resp.status === 401) {
        gate.classList.remove("hide");
        document.getElementById("searchBar").classList.add("hide");
        feed.innerHTML = "";
        return;
      }
      const next = nextPath();
      if (next) {
        location.replace(next);
        return;
      }
      gate.classList.add("hide");
      document.getElementById("searchBar").classList.remove("hide");
      const body = await resp.json();
      if (body.days) allDays = body.days;
      rebuildDayPick();
      render(body.items || []);
    }

    document.getElementById("login").onclick = async () => {
      const token = tokenBox.value.trim();
      document.getElementById("gateErr").textContent = "";
      const resp = await fetch("/chats/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify({ token }),
      });
      const body = await resp.json().catch(() => ({}));
      if (!resp.ok) {
        document.getElementById("gateErr").textContent = (body.error && body.error.message) || "Token 不对";
        return;
      }
      sessionStorage.setItem("helm_chats_token", token);
      tokenBox.value = "";
      goNextOrLoad();
    };
    prevDay.onclick = () => stepDay(-1);
    nextDay.onclick = () => stepDay(1);
    dayPick.onchange = () => {
      viewDay = dayPick.value;
      syncDayUi();
      load(false);
    };
    q.addEventListener("input", () => {
      clearTimeout(timer);
      timer = setTimeout(() => load(false), 200);
    });
    if (nextPath() === "/setup") {
      const h = document.querySelector(".gate h2");
      const p = document.querySelector(".gate p");
      if (h) h.textContent = "打开配置向导";
      if (p) p.textContent = "填手机设置里同一枚 Hub Token，登录后跳到配置页。";
    }
    load(true);
    // 只有「今晚」在实时动；翻旧账和搜索都是静止的过去，不刷
    setInterval(() => {
      if (document.visibilityState === "visible" && !viewDay && !q.value.trim()) load(false);
    }, 4000);
  </script>
</body>
</html>
