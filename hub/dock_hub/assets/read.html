<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>守岸人 · 朗读</title>
    <link rel="stylesheet" href="/assets/pico.min.css" />
  <link rel="stylesheet" href="/assets/shell.css" />

</head>
<body class="shelf">
  <nav class="container-fluid">
    <ul>
      <li><strong>守岸人</strong></li>
    </ul>
    <ul>
      <li><a href="/read" role="button" aria-current="page">朗读</a></li>
      <li><a href="/chats" role="button" class="secondary">对话</a></li>
      <li><a href="/setup" role="button" class="secondary">配置</a></li>
      <li><button class="outline secondary" id="stop" type="button">停止</button></li>
    </ul>
  </nav>
  <main id="panel">
    <div class="layout">
      <section>
        <div id="story">
          <div class="meta">
            <span id="bookTitle">还没有书</span>
            <span id="chapterTitle"></span>
            <span id="progressLabel"></span>
          </div>
          <div id="chapterBody" class="reader">把 txt 放进书架，或从下面导入。也可以把文件拖到这里。</div>
          <div class="bar controls" style="margin-top:12px">
            <button id="storyPlay" type="button">播放</button>
            <button class="secondary" id="storyPause" type="button">暂停</button>
            <button class="secondary" id="prevChapter" type="button">上一章</button>
            <button class="secondary" id="nextChapter" type="button">下一章</button>
            <button class="secondary phone-only" id="tocToggle" type="button">目录</button>
            <select id="timer" aria-label="定时">
              <option value="0">关</option>
              <option value="15">15 分钟</option>
              <option value="30">30 分钟</option>
              <option value="45">45 分钟</option>
              <option value="60">60 分钟</option>
            </select>
            <span id="timerLeft" class="hint"></span>
          </div>
          <div class="voice">
            <label>音量 <input id="voiceVolume" type="range" min="0" max="100" step="1" value="50" aria-label="系统音量" /><b id="voiceVolumeVal">50</b></label>
            <label>语速 <input id="voiceSpeed" type="range" min="0.7" max="1.5" step="0.1" value="1" aria-label="语速" /><b id="voiceSpeedVal">1.0×</b></label>
          </div>
          <p id="storyStatus" class="ok"></p>
          <div class="bar">
            <button class="secondary" id="importBtn" type="button">导入文本</button>
            <input id="import" class="hide" type="file" accept=".txt,text/plain" />
            <button class="outline secondary" id="showShort" type="button">短稿</button>
          </div>
          <div id="importBox" class="hide">
            <div class="progress" id="importTrack"><span id="importBar"></span></div>
            <p id="importLabel" class="hint"></p>
          </div>
          <ol id="readLog" class="read-log"></ol>
        </div>
        <div id="short" class="hide">
        <textarea id="text" placeholder="贴讲书稿，或拖入一份 txt。划选一段则只读选区。" maxlength="8000"></textarea>
        <div class="meta">
          <span>字数 <strong id="chars">0</strong> / 8000</span>
          <span>预估 <strong id="estimate">0 秒</strong></span>
          <span class="scope" id="scope"></span>
        </div>
        <div class="bar">
          <button id="play" type="button">播放</button>
          <button class="secondary" id="file" type="button">生成 WAV</button>
          <button class="secondary" id="clear" type="button">清空</button>
          <button class="secondary" id="showStory" type="button">回到这本书</button>
          <label class="toggle"><input type="checkbox" id="autodl" /> 完成后自动下载</label>
        </div>
        </div>
        <p class="hint wide-only">Ctrl/⌘ + Enter 播放 · Shift + Enter 生成 · Esc 停止</p>
        <p id="status" class="ok"></p>
        <p id="err" class="err"></p>
      </section>
      <section>
        <div id="tocPane">
          <div class="toc-head">
            <h2>目录</h2>
            <button class="secondary phone-only" id="tocClose" type="button">关闭</button>
          </div>
          <input id="tocQuery" type="search" enterkeyhint="go" placeholder="章名或序号，回车跳转" autocomplete="off" />
          <p id="splitNote" class="hint"></p>
          <div id="toc" class="toc"><p class="empty">还没有目录。</p></div>
        </div>
        <div id="jobPane" class="hide">
        <h2>任务</h2>
        <div id="jobs" class="jobs"><p class="empty">还没有任务。</p></div>
        </div>
      </section>
    </div>
  </main>
  <article id="gate" class="gate hide">
    <h2>局域网使用</h2>
    <p>填手机设置里同一枚 Hub Token。本机打开不用填。</p>
    <div class="bar">
      <input type="password" id="token" placeholder="Token" autocomplete="off" />
      <button class="primary" id="login" type="button">进入</button>
    </div>
    <p id="gateErr" class="err"></p>
  </article>
  <script>
    const DRAFT_KEY = "helm_read_draft";
    const AUTODL_KEY = "helm_read_autodl";
    const textBox = document.getElementById("text");
    const charsEl = document.getElementById("chars");
    const estimateEl = document.getElementById("estimate");
    const scopeEl = document.getElementById("scope");
    const statusEl = document.getElementById("status");
    const errEl = document.getElementById("err");
    const jobsEl = document.getElementById("jobs");
    const panel = document.getElementById("panel");
    const gate = document.getElementById("gate");
    const playBtn = document.getElementById("play");
    const fileBtn = document.getElementById("file");
    const stopBtn = document.getElementById("stop");
    const autodlEl = document.getElementById("autodl");
    const importInput = document.getElementById("import");
    const mine = new Set();
    const downloaded = new Set();
    let pollTimer = 0;
    let jobSpeaking = false;
    let storyState = null;

    function syncStop() {
      stopBtn.disabled = !(jobSpeaking || (storyState && storyState.playing));
    }

    function spokenChars(t) {
      return (t || "").replace(/\s+/g, "").length;
    }
    function fmtSec(sec) {
      const s = Math.max(0, Math.round(Number(sec) || 0));
      const m = Math.floor(s / 60);
      const r = s % 60;
      if (!s) return "0 秒";
      if (m <= 0) return r + " 秒";
      return m + " 分 " + String(r).padStart(2, "0") + " 秒";
    }
    function estimateSec(t) {
      const n = spokenChars(t);
      if (!n) return 0;
      return Math.max(1, Math.round(n / 4));
    }
    function authHeaders() {
      const t = sessionStorage.getItem("helm_chats_token") || "";
      return t ? { Authorization: "Bearer " + t } : {};
    }
    function selectedText() {
      const start = textBox.selectionStart;
      const end = textBox.selectionEnd;
      if (end > start) return textBox.value.slice(start, end);
      return "";
    }
    function manuscript() {
      const sel = selectedText();
      return (sel || textBox.value).trim();
    }
    function refreshMeta() {
      const all = spokenChars(textBox.value);
      const sel = spokenChars(selectedText());
      const using = sel || all;
      charsEl.textContent = String(all);
      estimateEl.textContent = fmtSec(estimateSec(sel ? selectedText() : textBox.value));
      scopeEl.textContent = sel ? ("将朗读选区 " + sel + " 字") : (all ? "将朗读全文" : "");
      localStorage.setItem(DRAFT_KEY, textBox.value);
    }
    function statusLabel(job) {
      if (job.mode === "play" && job.status === "queued") return "等待播放";
      if (job.mode === "play" && job.status === "running") return "正在送到书桌";
      if (job.mode === "play" && job.status === "done") return "已送到书桌";
      if (job.status === "queued") return "排队中";
      if (job.status === "running") return "合成中";
      if (job.status === "done") return "已完成";
      if (job.status === "cancelled") return "已取消";
      if (job.status === "error") return "失败";
      return job.status || "";
    }
    function progressPct(job) {
      const n = Number(job.chunks) || 0;
      const d = Number(job.done) || 0;
      if (job.status === "done") return 100;
      if (!n) return 0;
      return Math.max(0, Math.min(100, Math.round((d / n) * 100)));
    }
    function escapeHtml(s) {
      return String(s || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
    function jobButtons(job) {
      const btns = [];
      if (job.status === "queued" || job.status === "running") {
        btns.push('<button type="button" class="secondary act" data-act="cancel" data-id="' + escapeHtml(job.id) + '">取消</button>');
      }
      if (job.status === "done" && job.audio_id) {
        btns.push('<button type="button" class="secondary dl" data-id="' + escapeHtml(job.audio_id) + '" data-name="' + escapeHtml(job.filename || "") + '">下载</button>');
      }
      if ((job.status === "done" || job.status === "cancelled" || job.status === "error") && job.id) {
        btns.push('<button type="button" class="secondary act" data-act="replay" data-id="' + escapeHtml(job.id) + '">再播</button>');
      }
      if (job.status !== "queued" && job.status !== "running") {
        btns.push('<button type="button" class="secondary act" data-act="delete" data-id="' + escapeHtml(job.id) + '">删除</button>');
      }
      return btns.length ? '<div class="bar">' + btns.join("") + "</div>" : "";
    }
    function renderJobs(items) {
      if (!items || !items.length) {
        jobsEl.innerHTML = '<p class="empty">还没有任务。播放或生成后会出现在这里。</p>';
        return;
      }
      jobsEl.innerHTML = items.map((job) => {
        const pct = progressPct(job);
        const bits = [];
        if (job.mode === "play") bits.push("播放");
        else bits.push("文件");
        if (job.chars) bits.push(job.chars + " 字");
        if (job.chunks) bits.push((job.done || 0) + " / " + job.chunks + " 段");
        if (job.duration_sec != null) bits.push("实际 " + fmtSec(job.duration_sec));
        else if (job.estimate_sec) bits.push("约 " + fmtSec(job.estimate_sec));
        if (job.status === "running" && job.chunks && job.done < job.chunks && job.estimate_sec) {
          const left = Math.max(0, job.estimate_sec * (1 - progressPct(job) / 100));
          bits.push("剩余约 " + fmtSec(left));
        }
        if (job.error) bits.push(job.error);
        return (
          '<div class="job" data-id="' + escapeHtml(job.id) + '">' +
            '<div class="job-top">' +
              '<div class="job-preview">' + escapeHtml(job.preview || job.id) + "</div>" +
              '<div class="job-status ' + escapeHtml(job.status) + '">' + escapeHtml(statusLabel(job)) + "</div>" +
            "</div>" +
            '<div class="job-meta">' + bits.map(escapeHtml).join(" · ") + "</div>" +
            '<div class="progress"><span style="width:' + pct + '%"></span></div>' +
            jobButtons(job) +
          "</div>"
        );
      }).join("");
      jobsEl.querySelectorAll("button.dl").forEach((btn) => {
        btn.onclick = () => downloadJob(btn.getAttribute("data-id"), btn.getAttribute("data-name"));
      });
      jobsEl.querySelectorAll("button.act").forEach((btn) => {
        btn.onclick = () => jobAction(btn.getAttribute("data-id"), btn.getAttribute("data-act"));
      });
    }
    async function api(path, opts) {
      const resp = await fetch(path, {
        credentials: "include",
        ...opts,
        headers: {
          Accept: "application/json",
          ...authHeaders(),
          ...(opts && opts.headers ? opts.headers : {}),
        },
      });
      const body = await resp.json().catch(() => ({}));
      if (resp.status === 401) {
        document.body.classList.add("gated");
        panel.classList.add("hide");
        gate.classList.remove("hide");
        return { resp, body, gated: true };
      }
      return { resp, body, gated: false };
    }
    async function downloadJob(audioId, filename) {
      if (!audioId) return;
      const wav = await fetch("/v1/companion/audio/" + encodeURIComponent(audioId) + "?download=1", {
        headers: { Accept: "audio/wav", ...authHeaders() },
        credentials: "include",
      });
      if (!wav.ok) {
        errEl.textContent = "文件在，下载失败。";
        return;
      }
      const blob = await wav.blob();
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = filename || ("shorekeeper-" + audioId + ".wav");
      document.body.appendChild(a);
      a.click();
      a.remove();
    }
    async function jobAction(id, action) {
      errEl.textContent = "";
      const { resp, body, gated } = await api("/v1/companion/read/jobs/" + encodeURIComponent(id) + "/" + action, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: "{}",
      });
      if (gated) return;
      if (!resp.ok) {
        errEl.textContent = (body.error && body.error.message) || "这次没做成。";
        return;
      }
      if (action === "replay" && body.id) mine.add(body.id);
      if (action === "delete") statusEl.textContent = "已从列表拿掉。";
      if (action === "cancel") statusEl.textContent = "已取消。";
      if (action === "replay") statusEl.textContent = "正在再送到书桌。";
      await refreshJobs();
    }
    async function refreshJobs() {
      const { resp, body, gated } = await api("/v1/companion/read/jobs");
      if (gated) return false;
      if (!resp.ok) return true;
      const items = body.items || [];
      renderJobs(items);
      for (const job of items) {
        if (autodlEl.checked && job.mode === "file" && job.status === "done" && job.audio_id && mine.has(job.id) && !downloaded.has(job.id)) {
          downloaded.add(job.id);
          statusEl.textContent = "已完成，开始下载 " + (job.filename || "wav") + "。";
          downloadJob(job.audio_id, job.filename);
        }
        if (job.status === "error" && mine.has(job.id)) {
          errEl.textContent = job.error || "这次没做成。";
        }
      }
      const speaking = items.some((j) => j.status === "queued" || j.status === "running");
      jobSpeaking = speaking;
      syncStop();
      return true;
    }
    function startPoll() {
      if (pollTimer) return;
      pollTimer = setInterval(() => {
        refreshJobs().catch(() => {});
        refreshStory().catch(() => {});
      }, 1000);
    }
    async function submit(mode) {
      errEl.textContent = "";
      statusEl.textContent = "";
      const text = manuscript();
      if (!spokenChars(text)) {
        errEl.textContent = selectedText() ? "选区是空的。" : "先贴一段文字。";
        return;
      }
      if (text.length > 8000) {
        errEl.textContent = "一次最多八千字。";
        return;
      }
      statusEl.textContent = mode === "play" ? "已加入播放队列。" : "已加入合成队列。";
      const { resp, body, gated } = await api("/v1/companion/read", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text, mode }),
      });
      if (gated) return;
      if (!resp.ok) {
        errEl.textContent = (body.error && body.error.message) || "这次没做成。";
        return;
      }
      if (body.id) mine.add(body.id);
      await refreshJobs();
      startPoll();
    }
    async function stopAll() {
      errEl.textContent = "";
      const { resp, body, gated } = await api("/v1/companion/stop", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: "{}",
      });
      if (gated) return;
      if (!resp.ok) {
        errEl.textContent = (body.error && body.error.message) || "没停住。";
        return;
      }
      statusEl.textContent = "已经停下。";
      await refreshJobs();
      await refreshStory();
    }
    function loadFile(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const raw = String(reader.result || "");
        textBox.value = raw.slice(0, 8000);
        refreshMeta();
        statusEl.textContent = file.name + (raw.length > 8000 ? " · 已截到八千字" : " · 已读入");
      };
      reader.readAsText(file, "utf-8");
    }

    const storyPane = document.getElementById("story");
    const shortPane = document.getElementById("short");
    const tocPane = document.getElementById("tocPane");
    const jobPane = document.getElementById("jobPane");
    const chapterBody = document.getElementById("chapterBody");
    const bookTitle = document.getElementById("bookTitle");
    const chapterTitle = document.getElementById("chapterTitle");
    const progressLabel = document.getElementById("progressLabel");
    const storyStatus = document.getElementById("storyStatus");
    const timerEl = document.getElementById("timer");
    const timerLeft = document.getElementById("timerLeft");
    const importBtn = document.getElementById("importBtn");
    const importBox = document.getElementById("importBox");
    const importTrack = document.getElementById("importTrack");
    const importBar = document.getElementById("importBar");
    const importLabel = document.getElementById("importLabel");
    const readLog = document.getElementById("readLog");
    const tocEl = document.getElementById("toc");
    const tocQuery = document.getElementById("tocQuery");
    const splitNote = document.getElementById("splitNote");
    const TOC_ROW = 44;
    let shelfBook = null;
    let chapterDoc = null;
    let importBusy = false;
    let notedStory = null;
    let tocActive = 0;
    let tocFilter = "";
    let tocRendering = false;
    let tocScrollQueued = 0;
    let lastPaint = { index: -1, rel: -1, sentence: "" };

    function showStoryView(on) {
      storyPane.classList.toggle("hide", !on);
      shortPane.classList.toggle("hide", on);
      tocPane.classList.toggle("hide", !on);
      jobPane.classList.toggle("hide", on);
    }
    function chapterOf(offset) {
      const chapters = (shelfBook && shelfBook.chapters) || [];
      if (!chapters.length) return null;
      const chars = Number(shelfBook.chars) || 0;
      if (offset >= chars) return chapters[chapters.length - 1];
      let lo = 0;
      let hi = chapters.length - 1;
      while (lo <= hi) {
        const mid = (lo + hi) >> 1;
        const ch = chapters[mid];
        if (offset < ch.start) hi = mid - 1;
        else if (offset >= ch.end) lo = mid + 1;
        else return ch;
      }
      return chapters[Math.max(0, Math.min(chapters.length - 1, lo))];
    }
    function scrollMarkIntoReader(mark) {
      const top = mark.offsetTop;
      const bottom = top + Math.max(mark.offsetHeight, 24);
      const viewTop = chapterBody.scrollTop;
      const viewBottom = viewTop + chapterBody.clientHeight;
      if (top >= viewTop + 32 && bottom <= viewBottom - 32) return;
      chapterBody.scrollTop = Math.max(0, top - chapterBody.clientHeight * 0.35);
    }
    function paintChapter(text, highlightStart, highlight) {
      const rel = Math.max(0, highlightStart || 0);
      const sentence = highlight || "";
      const index = chapterDoc ? chapterDoc.index : -1;
      if (lastPaint.index === index && lastPaint.rel === rel && lastPaint.sentence === sentence && chapterBody.querySelector("#here")) return;
      const chapterChanged = lastPaint.index !== index;
      lastPaint = { index, rel, sentence };
      chapterBody.replaceChildren();
      const source = text || "";
      const before = source.slice(0, rel);
      const mid = sentence ? source.slice(rel, rel + sentence.length) : "";
      const after = source.slice(rel + mid.length);
      const mark = document.createElement(sentence ? "mark" : "span");
      mark.id = "here";
      mark.textContent = mid;
      chapterBody.append(document.createTextNode(before), mark, document.createTextNode(after));
      if (chapterChanged || sentence) scrollMarkIntoReader(mark);
    }
    function tocRows() {
      const chapters = (shelfBook && shelfBook.chapters) || [];
      const q = tocFilter.trim().toLowerCase();
      if (!q) return chapters;
      return chapters.filter((ch) => {
        const title = (ch.title || "").toLowerCase();
        const label = String(ch.index + 1);
        return title.includes(q) || label.includes(q);
      });
    }
    function closeTocIfPhone() {
      document.body.classList.remove("toc-open");
    }
    function renderTocWindow() {
      const chapters = (shelfBook && shelfBook.chapters) || [];
      const note = shelfBook && shelfBook.problem_label ? shelfBook.problem_label : "";
      const rows = tocRows();
      splitNote.textContent = chapters.length
        ? ((tocFilter ? ("匹配 " + rows.length + " / ") : "") + chapters.length + " 章" + (note ? " · " + note : ""))
        : note;
      if (!chapters.length) {
        tocEl.innerHTML = '<p class="empty">还没有目录。</p>';
        return;
      }
      if (!rows.length) {
        tocEl.innerHTML = '<p class="empty">没有这一章。</p>';
        return;
      }
      const height = tocEl.clientHeight || 320;
      const start = Math.max(0, Math.floor(tocEl.scrollTop / TOC_ROW) - 6);
      const count = Math.ceil(height / TOC_ROW) + 14;
      const slice = rows.slice(start, start + count);
      const html = '<div style="height:' + (rows.length * TOC_ROW) + 'px;position:relative">' + slice.map((ch, i) => {
        const top = (start + i) * TOC_ROW;
        const on = ch.index === tocActive ? " on" : "";
        const title = ch.title || ("第 " + (ch.index + 1) + " 章");
        const prefix = ch.volume ? (ch.volume + " · ") : "";
        return '<button type="button" class="' + on + '" style="position:absolute;top:' + top + 'px;left:0;right:0;height:' + TOC_ROW + 'px" data-start="' + ch.start + '" data-index="' + ch.index + '">' + escapeHtml(prefix + title) + "</button>";
      }).join("") + "</div>";
      const keep = tocEl.scrollTop;
      tocRendering = true;
      tocEl.innerHTML = html;
      if (tocEl.scrollTop !== keep) tocEl.scrollTop = keep;
      tocRendering = false;
    }
    function setTocActive(index) {
      const changed = index !== tocActive;
      tocActive = index;
      if (changed && !tocFilter) {
        const pos = ((shelfBook && shelfBook.chapters) || []).findIndex((ch) => ch.index === index);
        if (pos >= 0) tocEl.scrollTop = Math.max(0, pos * TOC_ROW - (tocEl.clientHeight || 320) / 2 + TOC_ROW);
      }
      renderTocWindow();
      if (!tocEl.clientHeight) requestAnimationFrame(renderTocWindow);
    }
    async function loadChapter(index, highlightStart, sentence) {
      if (!shelfBook) return;
      const { resp, body, gated } = await api("/v1/companion/books/" + encodeURIComponent(shelfBook.id) + "/chapter/" + index);
      if (gated || !resp.ok) return;
      chapterDoc = body;
      const rel = highlightStart == null ? 0 : highlightStart - body.start;
      paintChapter(body.text, rel, sentence || "");
      chapterTitle.textContent = body.title || "";
    }
    async function openShelfBook(id) {
      const { resp, body, gated } = await api("/v1/companion/books/" + encodeURIComponent(id));
      if (gated || !resp.ok) {
        errEl.textContent = (body.error && body.error.message) || "这本书打不开。";
        return;
      }
      shelfBook = body;
      lastPaint = { index: -1, rel: -1, sentence: "" };
      bookTitle.textContent = body.title || id;
      const ch = chapterOf(body.bookmark || 0);
      setTocActive(ch ? ch.index : 0);
      if (ch) await loadChapter(ch.index, null, "");
      const percent = body.chars ? Math.round(((body.bookmark || 0) / body.chars) * 100) : 0;
      progressLabel.textContent = ch ? ((ch.index + 1) + " / " + body.chapters.length + " · " + percent + "%") : "";
    }
    function paintTimer(story) {
      const left = story && story.timer_remaining_sec;
      if (left == null) {
        timerLeft.textContent = "";
        return;
      }
      timerLeft.textContent = left >= 60 ? ("还剩 " + Math.ceil(left / 60) + " 分") : ("还剩 " + left + " 秒");
    }
    function pushLog(line) {
      const now = new Date();
      const stamp = [now.getHours(), now.getMinutes(), now.getSeconds()]
        .map((n) => String(n).padStart(2, "0"))
        .join(":");
      const li = document.createElement("li");
      li.textContent = stamp + "  " + line;
      readLog.appendChild(li);
      while (readLog.children.length > 12) readLog.removeChild(readLog.firstChild);
      readLog.scrollTop = readLog.scrollHeight;
    }
    function noteStory(prev, story) {
      if (!story) return;
      if (!prev || prev.book_id !== story.book_id) {
        if (story.book_id && !importBusy) pushLog("打开 " + story.book_id.replace(/\.txt$/, ""));
        return;
      }
      if (story.timer_min !== prev.timer_min) {
        pushLog(story.timer_min ? "定时 " + story.timer_min + " 分钟" : "定时已关");
      }
      if (story.playing && !prev.playing) {
        pushLog("开始读 " + (story.chapter_title || ""));
        return;
      }
      if (!story.playing && prev.playing) {
        if (story.stopped_by === "timer") pushLog("到时间了，已停下");
        else if (story.stopped_by === "end") pushLog("已读完");
        else if (story.stopped_by === "error") pushLog(story.error || "这次没读成");
        else pushLog("已暂停");
        return;
      }
      if (story.playing && story.chapter !== prev.chapter) pushLog("进入 " + (story.chapter_title || ""));
    }
    async function applyStory(story) {
      const prev = notedStory;
      notedStory = story;
      storyState = story;
      try {
      noteStory(prev, story);
      if (!story) return;
      if (story.timer_min != null) timerEl.value = String(story.timer_min);
      paintTimer(story);
      if (story.stopped_by === "timer") storyStatus.textContent = "到时间了，已停下。";
      else if (story.stopped_by === "end") storyStatus.textContent = "已读完。";
      else if (story.stopped_by === "error") storyStatus.textContent = story.error || "这次没读成。";
      else if (story.playing) storyStatus.textContent = "正在读。";
      else storyStatus.textContent = "";
      if (!story.book_id) return;
      if (!shelfBook || shelfBook.id !== story.book_id) await openShelfBook(story.book_id);
      const ch = story.chapter != null ? shelfBook.chapters[story.chapter] : chapterOf(story.offset || 0);
      if (!ch) return;
      const percent = story.chars ? Math.round(((story.offset || 0) / story.chars) * 100) : 0;
      progressLabel.textContent = (ch.index + 1) + " / " + (story.chapters || shelfBook.chapters.length) + " · " + percent + "%";
      if (tocActive !== ch.index || tocFilter) setTocActive(ch.index);
      else if (!tocEl.querySelector("button")) renderTocWindow();
      const sentence = story.playing ? (story.sentence || "") : "";
      const start = story.playing ? story.sentence_start : (story.offset || 0);
      if (!chapterDoc || chapterDoc.index !== ch.index) await loadChapter(ch.index, start, sentence);
      else paintChapter(chapterDoc.text, start == null ? 0 : start - chapterDoc.start, sentence);
      } finally {
        syncStop();
      }
    }
    async function refreshStory() {
      const { resp, body, gated } = await api("/v1/companion/story");
      if (gated || !resp.ok) return;
      await applyStory(body);
    }
    async function storyPlay(offset) {
      if (!shelfBook && offset == null) return;
      const id = (storyState && storyState.book_id) || (shelfBook && shelfBook.id);
      if (!id) return;
      const payload = offset == null ? {} : { offset: offset };
      const { resp, body, gated } = await api("/v1/companion/books/" + encodeURIComponent(id) + "/play", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      if (gated) return;
      if (!resp.ok) {
        errEl.textContent = (body.error && body.error.message) || "这次没读成。";
        return;
      }
      await applyStory(body);
    }
    async function jumpChapter(start, index) {
      const id = shelfBook && shelfBook.id;
      if (!id) return;
      if (storyState && storyState.playing) {
        await storyPlay(start);
        return;
      }
      const { resp, body, gated } = await api("/v1/companion/books/" + encodeURIComponent(id) + "/bookmark", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ offset: start }),
      });
      if (gated || !resp.ok) return;
      await applyStory(body);
    }
    function finishImport(message) {
      importBusy = false;
      importBtn.disabled = false;
      importTrack.classList.remove("busy");
      importBar.style.width = "0%";
      importBox.classList.add("hide");
      importLabel.textContent = "";
      if (message) pushLog(message);
    }
    function importFailure(xhr, body) {
      const message = (body && body.error && body.error.message) || "";
      const status = xhr ? xhr.status : 0;
      const line = message
        ? ("没放进书架：" + message)
        : (status ? ("没放进书架（HTTP " + status + "）") : "没放进书架：连接被中断");
      errEl.textContent = message || line;
      finishImport(line);
    }
    function uploadBook(file) {
      if (!file || importBusy) return;
      importBusy = true;
      importBtn.disabled = true;
      errEl.textContent = "";
      importBox.classList.remove("hide");
      importTrack.classList.remove("busy");
      importBar.style.width = "0%";
      importLabel.textContent = "正在上传 0%";
      let importMark = 0;
      pushLog("开始导入 " + file.name + " · " + Math.max(1, Math.round(file.size / 1024)) + " KB");
      const xhr = new XMLHttpRequest();
      xhr.open("POST", "/v1/companion/books");
      xhr.withCredentials = true;
      xhr.setRequestHeader("Content-Type", "application/octet-stream");
      xhr.setRequestHeader("X-Filename", encodeURIComponent(file.name));
      const headers = authHeaders();
      Object.keys(headers).forEach((key) => xhr.setRequestHeader(key, headers[key]));
      xhr.upload.onprogress = (event) => {
        if (!event.lengthComputable || !event.total) return;
        const pct = Math.min(100, Math.round((event.loaded / event.total) * 100));
        importBar.style.width = pct + "%";
        importLabel.textContent = "正在上传 " + pct + "%";
        const step = pct >= 100 ? 100 : Math.floor(pct / 25) * 25;
        if (step >= 25 && step > importMark) {
          importMark = step;
          pushLog("已上传 " + step + "%");
        }
      };
      xhr.onload = async () => {
        let body = {};
        try { body = JSON.parse(xhr.responseText || "{}"); } catch (e) { body = {}; }
        if (xhr.status === 401) {
          document.body.classList.add("gated");
          panel.classList.add("hide");
          gate.classList.remove("hide");
          finishImport("需要 Token。");
          return;
        }
        if (xhr.status < 200 || xhr.status >= 300) {
          importFailure(xhr, body);
          return;
        }
        importBar.style.width = "100%";
        importTrack.classList.add("busy");
        importLabel.textContent = "正在识别章节";
        pushLog("正在识别章节");
        await openShelfBook(body.id);
        if (!shelfBook || shelfBook.id !== body.id) {
          finishImport(errEl.textContent || "这本书没打开。");
          return;
        }
        const count = shelfBook && shelfBook.chapters ? shelfBook.chapters.length : 0;
        storyStatus.textContent = file.name + " · 已放进书架。";
        notedStory = { book_id: body.id, playing: false, chapter: null, timer_min: notedStory && notedStory.timer_min, stopped_by: null };
        finishImport("已放进书架" + (count ? " · " + count + " 章" : ""));
      };
      xhr.onerror = () => importFailure(xhr, {});
      xhr.send(file);
    }

    document.getElementById("storyPlay").onclick = () => storyPlay(null);
    document.getElementById("storyPause").onclick = () => stopAll();
    document.getElementById("prevChapter").onclick = () => {
      const current = chapterDoc ? chapterDoc.index : 0;
      const prev = Math.max(0, current - 1);
      const ch = shelfBook && shelfBook.chapters[prev];
      if (ch) jumpChapter(ch.start, ch.index);
    };
    document.getElementById("nextChapter").onclick = () => {
      const current = chapterDoc ? chapterDoc.index : 0;
      const next = shelfBook ? Math.min(shelfBook.chapters.length - 1, current + 1) : 0;
      const ch = shelfBook && shelfBook.chapters[next];
      if (ch) jumpChapter(ch.start, ch.index);
    };
    const voiceVolume = document.getElementById("voiceVolume");
    const voiceSpeed = document.getElementById("voiceSpeed");
    const voiceVolumeVal = document.getElementById("voiceVolumeVal");
    const voiceSpeedVal = document.getElementById("voiceSpeedVal");
    let voiceTimer = 0;
    function paintVoice() {
      voiceVolumeVal.textContent = voiceVolume.value;
      voiceSpeedVal.textContent = Number(voiceSpeed.value).toFixed(1) + "×";
    }
    function scheduleVoice() {
      paintVoice();
      clearTimeout(voiceTimer);
      voiceTimer = setTimeout(saveVoice, 200);
    }
    async function loadVoice() {
      const { resp, body, gated } = await api("/setup/api/state");
      if (gated || !resp.ok || !body.voice) return;
      if (document.activeElement !== voiceVolume && body.voice.volume != null) voiceVolume.value = String(body.voice.volume);
      if (document.activeElement !== voiceSpeed && body.voice.speed != null) voiceSpeed.value = String(body.voice.speed);
      paintVoice();
    }
    async function saveVoice() {
      const { resp, body, gated } = await api("/setup/api/voice", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          volume: Number(voiceVolume.value),
          speed: Number(voiceSpeed.value),
        }),
      });
      if (gated || resp.ok) {
        if (resp.ok && body.message && body.message !== "已生效") storyStatus.textContent = body.message;
        return;
      }
      errEl.textContent = body.message || (body.error && body.error.message) || "音量没改成。";
    }
    voiceVolume.addEventListener("input", scheduleVoice);
    voiceSpeed.addEventListener("input", scheduleVoice);
    paintVoice();
    timerEl.onchange = async () => {
      const { resp, body, gated } = await api("/v1/companion/story/timer", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ minutes: Number(timerEl.value) }),
      });
      if (!gated && resp.ok) await applyStory(body);
    };
    document.getElementById("showShort").onclick = () => { closeTocIfPhone(); showStoryView(false); };
    document.getElementById("showStory").onclick = () => showStoryView(true);
    document.getElementById("tocToggle").onclick = () => {
      document.body.classList.add("toc-open");
      requestAnimationFrame(renderTocWindow);
      tocQuery.focus();
    };
    document.getElementById("tocClose").onclick = () => closeTocIfPhone();
    tocEl.addEventListener("scroll", () => {
      if (tocRendering || tocScrollQueued) return;
      tocScrollQueued = requestAnimationFrame(() => {
        tocScrollQueued = 0;
        renderTocWindow();
      });
    });
    tocEl.addEventListener("click", (e) => {
      const btn = e.target.closest("button");
      if (!btn || !tocEl.contains(btn)) return;
      jumpChapter(Number(btn.getAttribute("data-start")), Number(btn.getAttribute("data-index")));
      closeTocIfPhone();
    });
    tocQuery.addEventListener("input", () => {
      tocFilter = tocQuery.value || "";
      tocEl.scrollTop = 0;
      renderTocWindow();
    });
    tocQuery.addEventListener("keydown", (e) => {
      if (e.key !== "Enter") return;
      e.preventDefault();
      const raw = tocQuery.value.trim();
      const n = Number(raw);
      let ch = null;
      if (raw && Number.isInteger(n) && shelfBook && n >= 1 && n <= shelfBook.chapters.length) ch = shelfBook.chapters[n - 1];
      if (!ch) ch = tocRows()[0];
      if (!ch) return;
      jumpChapter(ch.start, ch.index);
      closeTocIfPhone();
    });

    autodlEl.checked = localStorage.getItem(AUTODL_KEY) === "1";
    autodlEl.onchange = () => localStorage.setItem(AUTODL_KEY, autodlEl.checked ? "1" : "0");
    const draft = localStorage.getItem(DRAFT_KEY);
    if (draft) textBox.value = draft.slice(0, 8000);
    textBox.addEventListener("input", refreshMeta);
    textBox.addEventListener("select", refreshMeta);
    textBox.addEventListener("keyup", refreshMeta);
    textBox.addEventListener("mouseup", refreshMeta);
    textBox.addEventListener("dragover", (e) => e.preventDefault());
    textBox.addEventListener("drop", (e) => {
      e.preventDefault();
      const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (file) loadFile(file);
    });
    playBtn.onclick = () => submit("play");
    fileBtn.onclick = () => submit("file");
    stopBtn.onclick = () => stopAll();
    document.getElementById("clear").onclick = () => {
      textBox.value = "";
      refreshMeta();
      statusEl.textContent = "";
      errEl.textContent = "";
    };
    chapterBody.addEventListener("dragover", (e) => e.preventDefault());
    chapterBody.addEventListener("drop", (e) => {
      e.preventDefault();
      const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (file) uploadBook(file);
    });
    document.getElementById("importBtn").onclick = () => importInput.click();
    importInput.onchange = () => {
      const file = importInput.files && importInput.files[0];
      if (file) uploadBook(file);
      importInput.value = "";
    };
    document.addEventListener("keydown", (e) => {
      const tag = document.activeElement && document.activeElement.tagName;
      const typing = tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT";
      if (e.key === "Escape") {
        e.preventDefault();
        stopAll();
        return;
      }
      if (!typing && e.key === " " && !e.repeat) {
        e.preventDefault();
        if (storyState && storyState.playing) stopAll();
        else storyPlay(null);
        return;
      }
      if (typing && (e.ctrlKey || e.metaKey) && e.key === "Enter") {
        e.preventDefault();
        submit(e.shiftKey ? "file" : "play");
      }
    });
    document.getElementById("login").onclick = async () => {
      const token = document.getElementById("token").value.trim();
      document.getElementById("gateErr").textContent = "";
      const resp = await fetch("/chats/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify({ token }),
      });
      const body = await resp.json().catch(() => ({}));
      if (!resp.ok) {
        document.getElementById("gateErr").textContent = (body.error && body.error.message) || "Token 不对";
        return;
      }
      sessionStorage.setItem("helm_chats_token", token);
      document.getElementById("token").value = "";
      document.body.classList.remove("gated");
      gate.classList.add("hide");
      panel.classList.remove("hide");
      refreshJobs().then((ok) => { if (ok) startPoll(); });
    };
    refreshMeta();
    stopBtn.disabled = true;
    (async function probe() {
      await loadVoice();
      const listed = await api("/v1/companion/books");
      if (!listed.gated && listed.resp.ok && listed.body.timer_min != null) {
        timerEl.value = String(listed.body.timer_min);
        if (listed.body.current_id) await openShelfBook(listed.body.current_id);
      }
      const ok = await refreshJobs();
      await refreshStory();
      if (ok || (listed.resp && listed.resp.ok)) startPoll();
    })();
  </script>
</body>
</html>
