<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>岸亭控制台</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233b6fd4'/%3E%3Ctext x='16' y='22' font-size='17' font-family='-apple-system,PingFang SC' text-anchor='middle' fill='white'%3E岸%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/assets/console.css" />
    <script>
      // 先按上次的选择上色，省得刷新时闪一下白
      (function () {
        try {
          var choice = localStorage.getItem("theme") || "system";
          var dark =
            choice === "dark" ||
            (choice === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (error) {
          /* 无痕模式里 localStorage 会抛，忽略 */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script src="/assets/console.js" defer></script>
  </body>
</html>
