<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>岸亭控制台</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a2332;
      --line: #2a3544;
      --text: #e8eef7;
      --muted: #8fa3bd;
      --accent: #3b82f6;
      --ok: #22c55e;
      --warn: #f59e0b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 15px/1.5 "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .wrap { max-width: 920px; margin: 0 auto; padding: 28px 20px 56px; }
    h1 { margin: 0; font-size: 28px; letter-spacing: -0.02em; }
    .sub { color: var(--muted); margin: 8px 0 0; }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin: 22px 0 18px;
    }
    .toolbar .spacer { flex: 1; }
    button {
      cursor: pointer;
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 650;
      font: inherit;
    }
    button:disabled { opacity: 0.45; cursor: default; }
    .btn { background: var(--accent); color: white; }
    .btn.secondary { background: #243044; color: var(--text); }
    .btn.danger { background: #7f1d1d; color: #fecaca; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      margin-bottom: 14px;
      overflow: hidden;
    }
    .card-head {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 16px 18px 12px;
    }
    .card-head h2 { margin: 0; font-size: 18px; }
    .blurb { color: var(--muted); margin: 2px 0 0; font-size: 13px; }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      background: #243044;
      color: var(--muted);
      white-space: nowrap;
    }
    .pill.ok { background: #143522; color: #86efac; }
    .pill.warn { background: #3b2a10; color: #fcd34d; }
    .pill.off { background: #1e293b; color: #94a3b8; }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: currentColor;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      padding: 0 18px 14px;
      color: var(--muted);
      font-size: 13px;
    }
    code {
      font-family: ui-monospace, "SF Mono", Consolas, monospace;
      font-size: 12.5px;
      background: #0d1218;
      border: 1px solid var(--line);
      padding: 1px 6px;
      border-radius: 6px;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 18px 16px; }
    .links { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 18px 16px; }
    .links a {
      color: #93c5fd;
      text-decoration: none;
      font-size: 13px;
      background: #121a24;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 10px;
    }
    details { border-top: 1px solid var(--line); }
    summary {
      cursor: pointer;
      padding: 12px 18px;
      color: var(--muted);
      font-size: 13px;
    }
    pre {
      margin: 0;
      padding: 0 18px 16px;
      max-height: 220px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
      color: #cbd5e1;
      font: 12px/1.45 ui-monospace, "SF Mono", Consolas, monospace;
    }
    .empty-log { color: var(--muted); padding: 0 18px 16px; font-size: 13px; }
    #toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      background: #14532d;
      color: #dcfce7;
      padding: 12px 16px;
      border-radius: 10px;
      display: none;
      max-width: min(420px, calc(100vw - 40px));
      z-index: 9;
    }
    #toast.err { background: #7f1d1d; color: #fecaca; }
    .foot { color: var(--muted); font-size: 12.5px; text-align: center; margin-top: 18px; }
    .config {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      padding: 0 18px 14px;
    }
    .config label { color: var(--muted); font-size: 13px; }
    .config input {
      flex: 1;
      min-width: 180px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #0d1218;
      color: var(--text);
      font: inherit;
    }
    .config .hint { flex-basis: 100%; color: var(--muted); font-size: 12.5px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>岸亭控制台</h1>
    <p class="sub">管这台 Mac 上的 Hub、监控和守岸人语音。关闭会卸掉这次登录里的任务，所以不会马上被自动拉起来。下次登录仍会开机启动。</p>
    <div class="toolbar">
      <button class="btn" id="all-start" type="button">全部启动</button>
      <button class="btn danger" id="all-stop" type="button">全部关闭</button>
      <button class="btn secondary" id="all-restart" type="button">全部重启</button>
      <span class="spacer"></span>
      <button class="btn secondary" id="refresh" type="button">刷新</button>
    </div>
    <div id="list"></div>
    <p class="foot">只监听 127.0.0.1。关掉这个页面或按 Ctrl+C，不会把下面的服务一起关掉。</p>
  </div>
  <div id="toast"></div>
  <script>
    const list = document.getElementById("list");
    const toastEl = document.getElementById("toast");
    const openLogs = new Set();
    let inflight = 0;
    let toastTimer = 0;

    const linksFor = {
      hub: [
        ["配置向导", "http://127.0.0.1:17890/setup"],
        ["聊天记录", "http://127.0.0.1:17890/chats"],
        ["朗读", "http://127.0.0.1:17890/read"],
      ],
    };

    function pillClass(label) {
      if (label === "运行中") return "pill ok";
      if (label === "进程在，端口未就绪" || label === "未安装") return "pill warn";
      return "pill off";
    }

    function toast(message, isError) {
      toastEl.textContent = message || (isError ? "没成功" : "完成");
      toastEl.className = isError ? "err" : "";
      toastEl.style.display = "block";
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { toastEl.style.display = "none"; }, 4200);
    }

    function setBusy(busy) {
      for (const button of document.querySelectorAll("button")) button.disabled = busy;
    }

    function render(services) {
      list.replaceChildren();
      for (const svc of services) {
        const card = document.createElement("section");
        card.className = "card";

        const head = document.createElement("div");
        head.className = "card-head";
        const titles = document.createElement("div");
        const h2 = document.createElement("h2");
        h2.textContent = svc.name;
        const blurb = document.createElement("p");
        blurb.className = "blurb";
        blurb.textContent = svc.blurb;
        titles.append(h2, blurb);
        const pill = document.createElement("span");
        pill.className = pillClass(svc.state_label);
        const dot = document.createElement("span");
        dot.className = "dot";
        pill.append(dot, document.createTextNode(svc.state_label));
        head.append(titles, pill);
        head.style.alignItems = "center";
        titles.style.flex = "1";

        const meta = document.createElement("div");
        meta.className = "meta";
        const bits = [
          "端口 " + svc.port,
          svc.pid ? "pid " + svc.pid : "",
          svc.domain || "",
          svc.health_summary || "",
          svc.health_error && !svc.health_ok ? svc.health_error : "",
        ].filter(Boolean);
        for (const bit of bits) {
          const span = document.createElement("span");
          span.textContent = bit;
          meta.append(span);
        }

        const actions = document.createElement("div");
        actions.className = "actions";
        for (const [action, label, cls] of [
          ["start", "启动", "btn"],
          ["stop", "关闭", "btn danger"],
          ["restart", "重启", "btn secondary"],
        ]) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = cls;
          button.textContent = label;
          button.addEventListener("click", () => act("/api/services/" + svc.id + "/" + action));
          actions.append(button);
        }

        card.append(head, meta, actions);

        if (svc.windows) {
          const form = document.createElement("form");
          form.className = "config";
          const label = document.createElement("label");
          label.textContent = "Windows 地址";
          const input = document.createElement("input");
          input.name = "address";
          input.autocomplete = "off";
          input.spellcheck = false;
          input.value = svc.windows.address || svc.windows.url || "";
          input.placeholder = "例如 10.83.22.31";
          const save = document.createElement("button");
          save.type = "submit";
          save.className = "btn";
          save.textContent = "保存";
          const state = document.createElement("span");
          state.className = svc.windows.online ? "pill ok" : "pill warn";
          state.textContent = svc.windows.label || "";
          const hint = document.createElement("div");
          hint.className = "hint";
          hint.textContent = "Hub 用这个地址连 Windows 探针，远程开程序、看电脑是否在线。保存后会重启 Hub。";
          form.append(label, input, save, state, hint);
          form.addEventListener("submit", (event) => {
            event.preventDefault();
            act("/api/config/windows", { address: input.value });
          });
          card.append(form);
        }

        const extras = linksFor[svc.id];
        if (extras) {
          const links = document.createElement("div");
          links.className = "links";
          for (const [label, href] of extras) {
            const a = document.createElement("a");
            a.href = href;
            a.target = "_blank";
            a.rel = "noopener";
            a.textContent = label;
            links.append(a);
          }
          card.append(links);
        }

        const details = document.createElement("details");
        if (openLogs.has(svc.id)) details.open = true;
        details.addEventListener("toggle", () => {
          if (details.open) openLogs.add(svc.id);
          else openLogs.delete(svc.id);
        });
        const summary = document.createElement("summary");
        summary.textContent = "最近日志";
        details.append(summary);
        if (svc.log_tail) {
          const pre = document.createElement("pre");
          pre.textContent = svc.log_tail;
          details.append(pre);
        } else {
          const empty = document.createElement("div");
          empty.className = "empty-log";
          empty.textContent = "还没有日志。";
          details.append(empty);
        }
        if (!svc.installed) {
          const hint = document.createElement("div");
          hint.className = "empty-log";
          hint.textContent = "登录项还没装。在仓库里运行 ./" + svc.install;
          details.append(hint);
        }
        card.append(details);
        list.append(card);
      }
    }

    async function load() {
      const active = document.activeElement;
      if (active && list.contains(active) && active.matches("input")) return;
      const response = await fetch("/api/status", { cache: "no-store" });
      const data = await response.json();
      render(data.services || []);
    }

    async function act(path, payload) {
      inflight += 1;
      setBusy(true);
      try {
        const options = { method: "POST" };
        if (payload) {
          options.headers = { "Content-Type": "application/json" };
          options.body = JSON.stringify(payload);
        }
        const response = await fetch(path, options);
        const body = await response.json();
        toast(body.message, !body.ok);
        await load();
      } catch (err) {
        toast(String(err), true);
      } finally {
        inflight -= 1;
        if (inflight === 0) setBusy(false);
      }
    }

    document.getElementById("all-start").addEventListener("click", () => act("/api/all/start"));
    document.getElementById("all-stop").addEventListener("click", () => act("/api/all/stop"));
    document.getElementById("all-restart").addEventListener("click", () => act("/api/all/restart"));
    document.getElementById("refresh").addEventListener("click", () => load().catch((err) => toast(String(err), true)));

    load().catch((err) => toast(String(err), true));
    setInterval(() => {
      if (inflight === 0) load().catch(() => {});
    }, 2500);
  </script>
</body>
</html>
