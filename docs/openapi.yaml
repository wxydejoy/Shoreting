openapi: 3.0.3
info:
  title: Shoreting LAN Protocol
  version: "1"
  description: >
    Android desk gadget ↔ Python Hub on the local network.
    The machine-readable contract for every route the Hub serves;
    docs/lan-protocol.md keeps the why, the timing and the debugging notes.
    Xiaomi did/siid/piid never appear on the wire.
    Action `icon` is a short name rendered by the Android app (Remix Icon).
    Optional snapshot.pc carries host CPU / memory / GPU / FPS telemetry.
    Optional snapshot.media is the system now-playing session; control it with
    POST /v1/devices/media/command (reserved id, not a devices[] item).
    Optional snapshot.companion is the on-desk character; talk with
    POST /v1/companion/chat.
    Mac Mini stats are a separate process on port 17891 (service helm-mini):
    GET /health and GET /v1/snapshot with the same pc object.
    Default host 10.83.22.121, Bearer token helm-mini-weiekko.
servers:
  - url: http://{host}:17890
    variables:
      host:
        default: 10.83.22.121
paths:
  /health:
    get:
      summary: Liveness probe, no auth
      operationId: getHealth
      security: []
      responses:
        "200":
          description: This process is a Shoreting Hub
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /metrics:
    get:
      summary: Prometheus text metrics (Android must not call this)
      description: >
        纯文本，不是 JSON，也不属于协议面。本机直连免 Token；跨机抓要带
        Bearer。计数在进程内，重启归零。首句延迟是最该看的一条。
      operationId: getMetrics
      responses:
        "200":
          description: Prometheus text exposition format
          content:
            text/plain:
              schema:
                type: string
              example: |
                # TYPE hub_companion_chat_total counter
                hub_companion_chat_total 12
        "401":
          $ref: "#/components/responses/Error"
  /v1/snapshot:
    get:
      summary: Full home-screen state (optionally long-polled)
      operationId: getSnapshot
      parameters:
        - name: since
          in: query
          required: false
          description: Last seen Snapshot.seq. With wait>0 the Hub holds the request until seq changes.
          schema:
            type: integer
            minimum: 0
        - name: wait
          in: query
          required: false
          description: Long-poll window in seconds, clamped to 30. Omit for a plain poll.
          schema:
            type: number
            minimum: 0
            maximum: 30
      responses:
        "200":
          description: Snapshot (including login_required)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Snapshot"
        "401":
          $ref: "#/components/responses/Error"
  /v1/companion/chat:
    post:
      summary: One companion turn (local LLM)
      operationId: postCompanionChat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanionChatRequest"
            example:
              text: 晚上好。
      responses:
        "200":
          description: Spoken reply text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanionChatResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/TooMany"
        "502":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Busy"
  /v1/companion/stop:
    post:
      summary: Stop companion speech on Mini speakers
      operationId: postCompanionStop
      responses:
        "200":
          description: Playback stopped, or nothing was playing
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/companion/announce:
    post:
      summary: Speak a short line on Mini speakers without a full chat turn
      operationId: postCompanionAnnounce
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
      responses:
        "200":
          description: Spoken (or cued) text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanionChatResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/TooMany"

  /v1/companion/read:
    post:
      summary: Hub reading page — play on Mini speakers or generate a downloadable wav
      operationId: postCompanionRead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  maxLength: 8000
                mode:
                  type: string
                  enum: [play, file]
                  default: play
      responses:
        "200":
          description: Play is done (or cued); file mode is queued and listed in GET /v1/companion/read/jobs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadJob"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/TooMany"
        "502":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Busy"
  /v1/companion/read/jobs:
    get:
      summary: Hub reading-page job list (progress / download). Android must not call this.
      operationId: getCompanionReadJobs
      responses:
        "200":
          description: Newest jobs first
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ReadJob"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/companion/audio/{id}:
    get:
      summary: Fetch one companion wav (home LAN only)
      operationId: getCompanionAudio
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9._-]+$"
      responses:
        "200":
          description: audio/wav
          content:
            audio/wav:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/devices/{id}/command:
    post:
      summary: Partial update of one allowlisted device, or run one action
      operationId: postDeviceCommand
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: lamp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceCommand"
            examples:
              turnOnLight:
                value:
                  on: true
                  brightness: 80
              turnOff:
                value:
                  on: false
              runAction:
                summary: Tap a home-screen logo
                value:
                  run: true
              mediaToggle:
                summary: Play or pause the system media session
                value:
                  media: toggle
      responses:
        "200":
          description: Device or action after the command
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/TooMany"
        "502":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  # ---- 下面是 Hub 早就在服务、文档一直没跟上的那批 ----
  # scripts/check_protocol.py 会对着 server.py 的 do_GET / do_POST 逐条比，
  # 少写一个就非零退出，所以别再靠记忆维护这份清单。
  /v1/weather:
    get:
      summary: Hub-side weather proxy (Open-Meteo)
      description: >
        手机可能连在只有局域网的 Wi-Fi 上，天气由 Hub 代取，安卓只跟 Hub 说话。
        结果按城市缓存 10 分钟。
      operationId: getWeather
      parameters:
        - name: city
          in: query
          required: true
          schema:
            type: string
          example: 杭州
      responses:
        "200":
          description: Current conditions for the resolved city
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Weather"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
  /v1/telemetry:
    post:
      summary: Windows probe pushes CPU / GPU telemetry into the snapshot
      description: >
        探针只在内网行走，不暴露 did。收到后立刻替换 Hub 手里的远端样本，
        超过 probe.stale_ms 没新样本就当作离线。
      operationId: postTelemetry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelemetryRequest"
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /v1/login-ticket:
    post:
      summary: Mint a one-shot ticket that turns a browser into a logged-in chats session
      description: >
        桌面托盘是这么把浏览器送进 /chats 的：不用把 token 贴进地址栏。
        票据 60 秒有效、只能兑换一次。
      operationId: postLoginTicket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                next:
                  type: string
                  default: /setup
                  description: 兑换后跳转的站内路径，外部地址会被拒绝
      responses:
        "200":
          description: Ticket and the URL to open
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginTicket"
        "401":
          $ref: "#/components/responses/Error"
  /v1/companion/chats:
    get:
      summary: Companion conversation log (Hub web UI only). Android must not call this.
      operationId: getCompanionChats
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 200
            maximum: 500
        - name: q
          in: query
          schema:
            type: string
          description: 在 user 与 reply 里做大小写无关的子串过滤
      responses:
        "200":
          description: Oldest first, newest last
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ChatTurn"
        "401":
          $ref: "#/components/responses/Error"
  /v1/companion/week:
    get:
      summary: 桌面周报（F27）。/week 页的数据源；安卓不打，想看开网页。
      operationId: getCompanionWeek
      responses:
        "200":
          description: 最近 7 天（含今天）逐日 + 合计 + 与上个 7 天的差
          content:
            application/json:
              schema:
                type: object
                properties:
                  line:
                    type: string
                    description: 周日晚她会念的那句；台账为空时是空串
                  summary:
                    type: object
                    properties:
                      days:
                        type: array
                        items:
                          type: object
                          properties:
                            date: { type: string, format: date }
                            weekday: { type: integer, minimum: 1, maximum: 7 }
                            desk_sec: { type: integer }
                            read_sec: { type: integer }
                            chats: { type: integer }
                            boots: { type: integer }
                            last_at:
                              type: string
                              description: HH:MM，当天最后一次活动
                      total:
                        type: object
                        description: desk_sec / read_sec / chats / boots 的 7 天合计
                      delta:
                        type: object
                        description: 合计减去再上一个 7 天
                      latest_at:
                        type: string
                        description: 本周最晚一次活动的时刻
        "401":
          $ref: "#/components/responses/Error"
  /v1/companion/memory:
    get:
      summary: 长期记忆列表（F28）。设置页「她记得的事」，逐条可见可删。
      operationId: getCompanionMemory
      responses:
        "200":
          description: 按学会时间排序，旧的在前
          content:
            application/json:
              schema:
                type: object
                properties:
                  limit:
                    type: integer
                    description: 记忆上限（超出时最旧的聊天来源先被挤掉）
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                          description: 条目标识（忌口 / 生日 / 记事1 …），删除时用它
                        value:
                          type: string
                        source:
                          type: string
                          enum: [chat, taught]
                        learned_at:
                          type: string
                          description: YYYY-MM-DD
        "401":
          $ref: "#/components/responses/Error"
    delete:
      summary: 删一条记忆（按 key）。404 表示没有这条。
      operationId: deleteCompanionMemory
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 删掉了
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  key: { type: string }
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/companion/books:
    get:
      summary: Shelf listing for the reading page
      operationId: getCompanionBooks
      responses:
        "200":
          description: Books on disk plus the reading position
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookList"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    post:
      summary: Upload one .txt book (raw body, not multipart)
      description: >
        请求体就是文件本身，文件名放在 X-Filename 头里；落盘后它成为当前书。
        上限 32MB。
      operationId: postCompanionBook
      parameters:
        - name: X-Filename
          in: header
          required: true
          schema:
            type: string
            example: 长夜将尽.txt
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema:
                type: object
                required: [id, bytes]
                properties:
                  id:
                    type: string
                  bytes:
                    type: integer
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/companion/books/{id}:
    get:
      summary: Open one book — chapter index and the saved bookmark
      operationId: getCompanionBook
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: 长夜将尽.txt
      responses:
        "200":
          description: Chapter list without the chapter text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookOpen"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/companion/books/{id}/chapter/{index}:
    get:
      summary: One chapter's text
      operationId: getCompanionBookChapter
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: index
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Chapter text and its offset range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookChapter"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/companion/books/{id}/{action}:
    post:
      summary: Start, pause, or bookmark reading for one book
      operationId: postCompanionBookAction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: action
          in: path
          required: true
          schema:
            type: string
            enum: [play, pause, bookmark]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                offset:
                  type: integer
                  minimum: 0
                  description: play 时从哪儿开始；bookmark 时记到哪儿
      responses:
        "200":
          description: Story state after the action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Story"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
  /v1/companion/story:
    get:
      summary: Where the reading is right now
      operationId: getCompanionStory
      responses:
        "200":
          description: Playback state, current sentence, timer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Story"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/companion/story/timer:
    post:
      summary: Sleep timer for reading
      operationId: postCompanionStoryTimer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [minutes]
              properties:
                minutes:
                  type: integer
                  enum: [0, 15, 30, 45, 60]
                  description: 0 means off
      responses:
        "200":
          description: Story state after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Story"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/companion/read/jobs/{id}/{action}:
    post:
      summary: Operate one reading job (Hub reading page)
      operationId: postCompanionReadJobAction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: action
          in: path
          required: true
          schema:
            type: string
            enum: [cancel, delete, replay]
      responses:
        "200":
          description: Job list after the action
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ReadJob"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/leave:
    post:
      summary: Leave home — switch off every switchable device, report the ones that failed
      operationId: postLeave
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: Ignored; send {} or nothing.
      responses:
        "200":
          description: Per-device results and what is left on
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveRun"
        "401":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/presence:
    post:
      summary: Presence report — phone joined / left the home Wi-Fi (F25)
      operationId: postPresence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state:
                  type: string
                  enum: [home, away]
                  description: >
                    home when the phone joins the home Wi-Fi, away after it has
                    been off it for 10 minutes. Debouncing is the client's job.
      responses:
        "200":
          description: Recorded state; `said` is the greeting she actually spoke, if any
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresenceReport"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /v1/at-desk:
    post:
      summary: At-desk report — camera ran locally, only a boolean leaves the device (F24)
      operationId: postAtDesk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [present]
              properties:
                present:
                  type: boolean
                  description: >-
                    Whether anyone is at the desk. Frames never leave the
                    device; only this boolean is reported.
                away_sec:
                  type: integer
                  minimum: 0
                  description: >-
                    How long the desk had been empty before this report, in
                    seconds. The Hub re-checks it: a greeting is only possible
                    when present is true and the desk was empty for at least
                    5 minutes.
      responses:
        "200":
          description: Recorded state; `said` is what she actually spoke, if any
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtDeskReport"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /v1/scenes/{id}:
    post:
      summary: Run one configured scene (a bundle of device commands)
      operationId: postScene
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: bedtime
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: Ignored; send {} or nothing.
      responses:
        "200":
          description: Per-device result of the scene
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SceneRun"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
security:
  - bearer: []
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: >-
        Hub 可以配多枚 token（主 token + 每台设备一枚，见 hub.yaml 的 tokens:），
        任一命中即放行。吊销一台 = 删掉 tokens: 里那一条并重载配置。
  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    TooMany:
      description: >-
        这一分钟内调得太勤（code = too_many）。按来源 IP + 端点分桶，
        桶容量等于每分钟次数。Retry-After 是建议等待秒数。
      headers:
        Retry-After:
          schema:
            type: integer
          description: 建议等待秒数（≥1）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    Busy:
      description: >-
        慢请求的并发名额满了（code = busy）。chat 与 read 各自只有少数几个位子：
        在跑的数量到顶就回 503，不排队——排队会让安卓一直转圈。
        客户端照 Retry-After 等两秒再试即可，不要立刻重试。
      headers:
        Retry-After:
          schema:
            type: integer
          description: 建议等待秒数（固定 2 秒）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
  schemas:
    Health:
      type: object
      required: [ok, service, protocol, name]
      properties:
        ok:
          type: boolean
          enum: [true]
        service:
          type: string
          enum: [dock-hub]
        protocol:
          type: integer
          enum: [1]
        name:
          type: string
    Snapshot:
      type: object
      required: [protocol, hub, temperature, devices]
      properties:
        protocol:
          type: integer
          enum: [1]
        seq:
          type: integer
          minimum: 0
          description: >-
            Monotonic state version. Pass back as `since` to long-poll; ignore
            when polling normally.
        hub:
          $ref: "#/components/schemas/HubStatus"
        temperature:
          allOf:
            - $ref: "#/components/schemas/Temperature"
          nullable: true
        pc:
          allOf:
            - $ref: "#/components/schemas/PcStatus"
          nullable: true
          description: >
            Host PC telemetry. null when disabled in hub.yaml.
            Independent of mijia login.
        media:
          allOf:
            - $ref: "#/components/schemas/MediaInfo"
          nullable: true
          description: >
            System media session. null when disabled in hub.yaml.
            Control via POST /v1/devices/media/command.
        companion:
          allOf:
            - $ref: "#/components/schemas/CompanionStatus"
          nullable: true
          description: >
            Desk companion. null when disabled in hub.yaml.
            Talk via POST /v1/companion/chat.
            Barge-in via POST /v1/companion/stop.
        devices:
          type: array
          items:
            $ref: "#/components/schemas/Device"
        scenes:
          type: array
          description: >
            Scenes from hub.yaml, in config order. Run one with
            POST /v1/scenes/{id}. Empty array when none are configured.
          items:
            $ref: "#/components/schemas/Scene"
        presence:
          allOf:
            - $ref: "#/components/schemas/Presence"
          nullable: true
          description: >
            Phone presence from POST /v1/presence. null until the first
            report after the Hub started.
        at_desk:
          allOf:
            - $ref: "#/components/schemas/AtDesk"
          nullable: true
          description: >
            Desk presence from POST /v1/at-desk. null until the first report
            after the Hub started.
    Presence:
      type: object
      required: [state]
      properties:
        state:
          type: string
          nullable: true
          enum: [home, away]
        since:
          type: string
          nullable: true
          description: ISO local time of the last state change.
    AtDesk:
      type: object
      required: [state]
      properties:
        state:
          type: string
          nullable: true
          enum: [present, away]
        since:
          type: string
          nullable: true
          description: ISO local time of the last state change.
    AtDeskReport:
      type: object
      required: [ok, present, said]
      properties:
        ok:
          type: boolean
        present:
          type: boolean
        away_sec:
          type: integer
          nullable: true
          description: The reported gap in seconds; null when the request omitted it.
        said:
          type: string
          nullable: true
          description: The line she actually spoke, null when gated (quota/quiet/off).
    PresenceReport:
      type: object
      required: [ok, state, previous, said]
      properties:
        ok:
          type: boolean
        state:
          type: string
          enum: [home, away]
        previous:
          type: string
          nullable: true
          enum: [home, away]
          description: null on the first report after the Hub started.
        said:
          type: string
          nullable: true
          description: >
            The away → home greeting she spoke, null when quiet hours, the
            daily quota or proactive.enabled=false kept her silent.
    Scene:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    SceneRun:
      type: object
      required: [id, name, ok, actions]
      properties:
        id:
          type: string
        name:
          type: string
        ok:
          type: boolean
          description: True only when every step succeeded.
        said:
          type: boolean
          description: >
            The companion is speaking the scene line asynchronously.
            False when the companion is off or the scene has no say.
        actions:
          type: array
          items:
            type: object
            required: [id, ok]
            properties:
              id:
                type: string
              on:
                type: boolean
              brightness:
                type: integer
                minimum: 1
                maximum: 100
              ok:
                type: boolean
              code:
                type: string
              message:
                type: string
    LeaveRun:
      type: object
      required: [ok, actions, left, spoken]
      description: 「我出门了」的结果。left 是没关掉的设备 id；spoken 是她要说的那句话。
      properties:
        ok:
          type: boolean
        actions:
          type: array
          items:
            type: object
            required: [id, on, ok]
            properties:
              id:
                type: string
              on:
                type: boolean
              ok:
                type: boolean
              code:
                type: string
              message:
                type: string
        left:
          type: array
          items:
            type: string
        spoken:
          type: string
    HubStatus:
      type: object
      required: [name, mijia, message]
      properties:
        name:
          type: string
        mijia:
          type: string
          enum: [ok, login_required, error]
        message:
          type: string
          nullable: true
    LeaveRun:
      type: object
      required: [ok, actions, left, spoken]
      description: 「我出门了」的结果。left 是没关掉的设备 id；spoken 是她要说的那句话。
      properties:
        ok:
          type: boolean
        actions:
          type: array
          items:
            type: object
            required: [id, on, ok]
            properties:
              id:
                type: string
              on:
                type: boolean
              ok:
                type: boolean
              code:
                type: string
              message:
                type: string
        left:
          type: array
          items:
            type: string
        spoken:
          type: string
    Temperature:
      type: object
      required: [id, name, celsius, updated_at, online]
      properties:
        id:
          type: string
        name:
          type: string
        celsius:
          type: number
        humidity:
          type: number
          description: Omit key if the sensor has no humidity
        updated_at:
          type: string
          format: date-time
        online:
          type: boolean
    PcStatus:
      type: object
      required: [online, updated_at]
      properties:
        online:
          type: boolean
          description: Whether this sample was collected successfully
        updated_at:
          type: string
          format: date-time
        cpu:
          $ref: "#/components/schemas/PcCpu"
        memory:
          $ref: "#/components/schemas/PcMemory"
        gpu:
          $ref: "#/components/schemas/PcGpu"
          description: Omit entire object when no discrete GPU / unread
        fps:
          type: number
          description: Current present/game FPS; omit key when unknown
    PcCpu:
      type: object
      required: [percent]
      properties:
        percent:
          type: number
          minimum: 0
          maximum: 100
        temp_celsius:
          type: number
          description: Omit when unread
    PcMemory:
      type: object
      required: [percent]
      properties:
        percent:
          type: number
          minimum: 0
          maximum: 100
        used_gb:
          type: number
        total_gb:
          type: number
    PcGpu:
      type: object
      properties:
        name:
          type: string
          example: RTX 4070
        percent:
          type: number
          minimum: 0
          maximum: 100
        temp_celsius:
          type: number
        vram_percent:
          type: number
          minimum: 0
          maximum: 100
        vram_used_gb:
          type: number
        vram_total_gb:
          type: number
    MediaInfo:
      type: object
      required: [online, playing, updated_at]
      properties:
        online:
          type: boolean
        playing:
          type: boolean
        title:
          type: string
          description: Omit when unknown
        artist:
          type: string
          description: Omit when unknown
        app:
          type: string
          description: Short player name such as Music or Spotify
        updated_at:
          type: string
          format: date-time
    CompanionStatus:
      type: object
      required: [ready, voice, speaking, timer]
      properties:
        ready:
          type: boolean
        voice:
          type: boolean
        speaking:
          type: boolean
        timer:
          nullable: true
          $ref: "#/components/schemas/TimerStatus"
    TimerStatus:
      type: object
      required: [mode]
      description: 番茄钟 / 正计时（F9）。倒计时到点 Hub 播报并清空；正计时「停止计时」结束。
      properties:
        mode:
          type: string
          enum: [timer, stopwatch]
        label:
          type: string
        total_sec:
          type: integer
          description: 仅 timer：总秒数
        seconds_left:
          type: integer
          description: 仅 timer：剩余秒数
        seconds:
          type: integer
          description: 仅 stopwatch：已计秒数
    CompanionChatRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
        weather:
          type: object
          additionalProperties: true
          description: Optional; ignored in phase 1
    CompanionChatResponse:
      type: object
      required: [text]
      properties:
        text:
          type: string
        audio_id:
          type: string
          nullable: true
          description: Null unless companion.tts.deliver is true and TTS succeeded. Default home setup leaves this null; Mini plays locally while Hub streams sentences.
    ReadJob:
      type: object
      properties:
        id:
          type: string
        job_id:
          type: string
        text:
          type: string
          description: Full manuscript; only on POST /v1/companion/read
        mode:
          type: string
          enum: [play, file]
        status:
          type: string
          enum: [queued, running, done, error]
        chars:
          type: integer
        estimate_sec:
          type: integer
        chunks:
          type: integer
        done:
          type: integer
        preview:
          type: string
        audio_id:
          type: string
          nullable: true
        duration_sec:
          type: number
          nullable: true
        bytes:
          type: integer
          nullable: true
        filename:
          type: string
          nullable: true
        error:
          type: string
          nullable: true
        format:
          type: string
    Weather:
      type: object
      required: [city, celsius, condition, query]
      properties:
        city:
          type: string
          description: 解出来的城市名；输坐标时是格式化后的坐标串
        celsius:
          type: number
          description: 当前气温，保留数据源的小数位
        condition:
          type: string
          example: 多云
        query:
          type: string
          description: 原样回填请求参数，方便安卓判断是不是自己要的那一趟
    TelemetryRequest:
      type: object
      properties:
        pc:
          allOf:
            - $ref: "#/components/schemas/PcStatus"
          description: 与 snapshot.pc 同构；缺 online 时按 true 处理
        running:
          type: array
          items:
            type: string
          description: 当前前台 / 关注的进程名，小写，用于「正在玩游戏」判断
    LoginTicket:
      type: object
      required: [ok, ticket, path]
      properties:
        ok:
          type: boolean
          enum: [true]
        ticket:
          type: string
        path:
          type: string
          example: /chats/claim?ticket=...&next=%2Fsetup
    ChatTurn:
      type: object
      required: [ts, turn, user, reply, ms]
      properties:
        ts:
          type: string
          format: date-time
        turn:
          type: string
          description: 这一轮的序号，安卓打断后靠它丢弃旧语音
        user:
          type: string
          description: 用户原话，超长会截断
        reply:
          type: string
          description: 守岸人的回复，超长会截断
        ms:
          type: integer
          description: 从收到请求到第一句可播的毫秒数
        skills:
          type: array
          items:
            type: object
            additionalProperties: true
        error:
          type: string
          nullable: true
    BookList:
      type: object
      required: [items, current_id, timer_min]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, title, bytes, mtime]
            properties:
              id:
                type: string
                description: 文件名，含 .txt，同时是后续接口里的 book id
              title:
                type: string
              bytes:
                type: integer
              mtime:
                type: integer
                description: Unix 秒
        current_id:
          type: string
          nullable: true
          description: 上次在读的那本；书被删掉后为 null
        timer_min:
          type: integer
          description: 睡前定时，0 表示关
    BookOpen:
      type: object
      required: [id, title, encoding, chars, bookmark, chapters, problem_label]
      properties:
        id:
          type: string
        title:
          type: string
        encoding:
          type: string
          description: 实际用上的编码，GBK 乱码排查看这个
        chars:
          type: integer
        bookmark:
          type: integer
          description: 已读到的字符偏移，不是章节号
        problem_label:
          type: string
          nullable: true
          description: 切章有问题时的一句话说明，正常为 null
        chapters:
          type: array
          items:
            type: object
            required: [index, title, volume, start, end]
            properties:
              index:
                type: integer
              title:
                type: string
              volume:
                type: string
                nullable: true
              start:
                type: integer
              end:
                type: integer
    BookChapter:
      type: object
      required: [index, title, text, start, end]
      properties:
        index:
          type: integer
        title:
          type: string
        text:
          type: string
        start:
          type: integer
        end:
          type: integer
    Story:
      type: object
      required: [playing, book_id, offset, chars, chapters, timer_min]
      properties:
        playing:
          type: boolean
        book_id:
          type: string
          nullable: true
        offset:
          type: integer
          description: 正在念的这句的起点，字符偏移
        chapter:
          type: integer
          nullable: true
        chapter_title:
          type: string
          nullable: true
        sentence:
          type: string
          nullable: true
          description: 正在念的这句原文；不在念时为 null
        sentence_start:
          type: integer
          nullable: true
        chars:
          type: integer
        chapters:
          type: integer
        timer_min:
          type: integer
        timer_remaining_sec:
          type: integer
          nullable: true
          description: 暂停时保留剩余秒数，恢复后接着倒
        stopped_by:
          type: string
          nullable: true
          enum: [user, timer, end, error]
          description: 上一次为什么停下；正在念或还没停过时为 null
        error:
          type: string
          nullable: true
    Device:
      type: object
      required: [id, name, type, online]
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [switch, light, action]
        online:
          type: boolean
        on:
          type: boolean
          description: switch and light only; omit for action
        brightness:
          type: integer
          minimum: 1
          maximum: 100
          description: light only; omit for switch and action
        icon:
          type: string
          description: >
            action only; short logo key. Android renders via Remix Icon.
            Known keys: steam, chrome, vscode/code, cursor,
            terminal/cmd/shell, folder, music, computer/pc/desktop.
          example: steam
        last_run_at:
          type: string
          format: date-time
          description: action only; last successful spawn, UTC
    DeviceCommand:
      type: object
      minProperties: 1
      properties:
        on:
          type: boolean
        brightness:
          type: integer
          minimum: 1
          maximum: 100
        run:
          type: boolean
          enum: [true]
          description: 'action only; Android must send exactly {"run": true}'
        media:
          type: string
          enum: [toggle, next, previous]
          description: >
            Reserved device id "media" only. Android sends exactly
            {"media":"toggle"|"next"|"previous"}. Response is MediaInfo,
            not a Device.
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - unauthorized
                - bad_request
                - unsupported
                - not_found
                - offline
                - login_required
                - mijia_error
                - action_error
                - media_error
            message:
              type: string
